<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070910">
<title>Pour Prune — Slither</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070910;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 10px 0}
.card{background:rgba(7,10,20,.68);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);border-radius:15px;padding:8px 11px;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.title{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.58}
.big{font-size:20px;font-weight:950;letter-spacing:-.03em}
.meta{font-size:10px;opacity:.62;margin-top:2px}
#leader{min-width:154px}
#leader .row{display:flex;justify-content:space-between;gap:12px;font-size:10px;margin-top:2px}
#leader .row b{font-weight:900}
#music{position:fixed;right:10px;top:calc(93px + env(safe-area-inset-top));pointer-events:auto;border:1px solid #fff2;background:#0a0e1bc9;color:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900;backdrop-filter:blur(10px)}
#event{position:fixed;left:50%;top:16%;transform:translate(-50%,-16px) scale(.96);opacity:0;transition:.25s;pointer-events:none;background:rgba(255,255,255,.96);color:#111;border-radius:999px;padding:10px 17px;font-size:12px;font-weight:950;box-shadow:0 12px 40px rgba(0,0,0,.5);white-space:nowrap}
#event.show{opacity:1;transform:translate(-50%,0) scale(1)}
#joy{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:126px;height:126px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 0 35px rgba(0,0,0,.35);touch-action:none;pointer-events:auto}
#joy:after{content:"";position:absolute;inset:25px;border:1px solid rgba(255,255,255,.08);border-radius:50%}
#stick{position:absolute;left:39px;top:39px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.3);box-shadow:0 5px 24px rgba(0,0,0,.55)}
#boost{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:radial-gradient(circle at 35% 30%,#ffe58b,#ff8d4f 70%,#e85d42);color:#160e09;font-weight:1000;font-size:13px;box-shadow:0 12px 38px rgba(0,0,0,.5);pointer-events:auto;touch-action:none}
#boost:active{transform:scale(.94)}
#mini{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));width:112px;height:78px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:#070a12c9;pointer-events:none;opacity:.82}
#menu{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,#1a2446 0,#090d19 48%,#05070d 100%)}
.panel{width:min(430px,93vw);padding:29px 23px;text-align:center;border-radius:28px;background:rgba(12,16,31,.86);border:1px solid rgba(255,255,255,.14);box-shadow:0 28px 100px rgba(0,0,0,.62);backdrop-filter:blur(16px)}
.logo{font-size:47px;filter:drop-shadow(0 10px 20px #0008)}
h1{font-size:39px;margin:4px 0 7px;letter-spacing:-.055em}
.sub{margin:0 auto 21px;max-width:355px;line-height:1.45;opacity:.8;font-size:14px}
#play{border:0;border-radius:16px;padding:15px 28px;background:#fff;color:#101117;font-size:16px;font-weight:1000;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.hint{margin-top:14px;font-size:11px;opacity:.45;line-height:1.5}
#deathStats{display:none;margin:14px 0;font-size:12px;opacity:.72}
@media (max-width:650px){#leader{min-width:136px}.big{font-size:18px}#joy{width:116px;height:116px}#stick{left:34px;top:34px}#boost{width:90px;height:90px}#music{top:calc(84px + env(safe-area-inset-top))}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="top">
    <div class="card">
      <div class="title">Prune</div>
      <div class="big"><span id="score">0</span> pts</div>
      <div class="meta">Taille <span id="size">30</span> · Rang <span id="rank">#1</span></div>
    </div>
    <div class="card" id="leader">
      <div class="title">Classement</div>
      <div class="row"><b id="n1">1. Prune</b><span id="s1">30</span></div>
      <div class="row"><b id="n2">2. —</b><span id="s2">—</span></div>
      <div class="row"><b id="n3">3. —</b><span id="s3">—</span></div>
      <div class="row"><b id="n4">4. —</b><span id="s4">—</span></div>
    </div>
  </div>
  <button id="music">♫ ON</button>
  <div id="event"></div>
  <div id="joy"><div id="stick"></div></div>
  <button id="boost">BOOST</button>
  <canvas id="mini" width="224" height="156"></canvas>
</div>

<div id="menu">
  <div class="panel">
    <div class="logo">🐍</div>
    <h1>Pour Prune</h1>
    <p class="sub">Coucou ma Prune.<br>J’ai préparé un petit jeu pour te remonter le moral.<br><b>PS : ne me remercie pas 😘</b></p>
    <button id="play">JOUER</button>
    <div id="deathStats"></div>
    <div class="hint">Joystick pour diriger · maintiens BOOST pour accélérer<br>Le jeu est pensé pour iPhone.</div>
  </div>
</div>

<script>
(()=>{"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const mini=document.getElementById("mini"),mctx=mini.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=1,raf=0,running=false,last=0,elapsed=0,score=0,boost=false;
const world={w:12000,h:12000},cam={x:0,y:0,zoom:1};
const foods=[],snakes=[];
const colors=["#ffd15a","#62e9ff","#ff70ad","#8df27b","#b995ff","#ff9c62","#6faeff","#ffe174","#67f2c7","#ff7777","#f3a6ff","#7ce7ff"];
const names=["Hugo","Le rival","Patate","Jean-Mi","Mini Safwan","Le malin","Speedy","Le boss","Le fou","Monsieur Boucle","Le serpent nul","???","Le voisin","Safwan.exe"];
const faceImgs=[1,2,3].map(n=>{const i=new Image();i.src="assets/face"+n+".jpg";return i});
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const adiff=(a,b)=>wrap(b-a);
let player=null;

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

function makeSnake(name,x,y,color,len,enemy=true,face=1){
 const a=rnd(-Math.PI,Math.PI);
 const s={name,x,y,color,len,enemy,face,angle:a,target:a,alive:true,think:rnd(.2,.8),mode:0,body:[],speed:4.2,boosting:false,phase:rnd(0,8)};
 for(let i=0;i<len;i++)s.body.push({x:x-Math.cos(a)*i*12,y:y-Math.sin(a)*i*12});
 return s;
}
function reset(){
 foods.length=0;snakes.length=0;score=0;elapsed=0;
 player=makeSnake("Prune",world.w/2,world.h/2,"#ffd15a",34,false,0);
 player.angle=-.05;player.target=player.angle;player.body=[];
 for(let i=0;i<34;i++)player.body.push({x:world.w/2-i*12,y:world.h/2});
 snakes.push(player);

 for(let i=0;i<14;i++){
   const a=i*Math.PI*2/14+rnd(-.08,.08),r=rnd(500,1800);
   const s=makeSnake(names[i],player.x+Math.cos(a)*r,player.y+Math.sin(a)*r,colors[(i+1)%colors.length],Math.floor(rnd(34,112)),true,1+(i%3));
   s.angle=a+Math.PI+rnd(-.8,.8);s.target=s.angle;
   s.x=clamp(s.x,160,world.w-160);s.y=clamp(s.y,160,world.h-160);
   snakes.push(s);
 }
 for(let i=0;i<2600;i++){
   const near=i<1200;
   foods.push({
    x:near?clamp(player.x+rnd(-2200,2200),100,world.w-100):rnd(100,world.w-100),
    y:near?clamp(player.y+rnd(-1900,1900),100,world.h-100):rnd(100,world.h-100),
    r:rnd(3.1,6.4),v:1+Math.floor(rnd(0,7)),p:rnd(0,Math.PI*2)
   });
 }
}

function addFood(x,y,v=2,r=5){
 foods.push({x:clamp(x,90,world.w-90),y:clamp(y,90,world.h-90),r,v,p:rnd(0,7)});
}
function eat(s){
 const grab=18+Math.min(12,s.len*.035);
 for(let i=foods.length-1;i>=0;i--){
   const f=foods[i],dx=s.x-f.x,dy=s.y-f.y;
   if(dx*dx+dy*dy<=(grab+f.r)*(grab+f.r)){
     s.len+=f.v*.19;
     if(s===player)score+=f.v;
     foods.splice(i,1);
   }
 }
}
function moveSnake(s,dt,baseSpeed){
 const speed=baseSpeed*(1+Math.min(.24,s.len/700));
 s.x+=Math.cos(s.angle)*speed*dt*60;
 s.y+=Math.sin(s.angle)*speed*dt*60;

 // Soft border steering keeps the player inside instead of snapping.
 const edge=340;
 if(s.x<edge)s.target=0;
 if(s.x>world.w-edge)s.target=Math.PI;
 if(s.y<edge)s.target=Math.PI/2;
 if(s.y>world.h-edge)s.target=-Math.PI/2;

 const wanted=Math.max(26,Math.floor(s.len));
 while(s.body.length<wanted){const q=s.body[s.body.length-1];s.body.push({x:q.x,y:q.y})}
 while(s.body.length>wanted)s.body.pop();
 s.body[0].x=s.x;s.body[0].y=s.y;

 const spacing=11.6+Math.min(2.6,s.len/500);
 for(let i=1;i<s.body.length;i++){
   const p=s.body[i-1],q=s.body[i],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1;
   if(d>spacing){q.x=p.x-dx/d*spacing;q.y=p.y-dy/d*spacing}
 }
 eat(s);
}
function kill(s,reason){
 if(!s.alive)return;
 s.alive=false;
 for(let i=0;i<s.body.length;i+=2){
   const q=s.body[i],a=rnd(0,Math.PI*2),rr=rnd(2,13);
   addFood(q.x+Math.cos(a)*rr,q.y+Math.sin(a)*rr,Math.max(2,Math.floor(s.len/12)),rnd(4.5,7.2));
 }
 if(s===player){
   running=false;stopMusic();
   const menu=document.getElementById("menu");
   menu.style.display="grid";
   document.querySelector("#menu h1").textContent="BOUM 💥";
   document.querySelector("#menu .sub").innerHTML="Ton serpent s’est fait avoir.<br><b>"+Math.floor(score)+" points</b><br>"+(reason||"Retente ta chance.");
   document.getElementById("play").textContent="REJOUER";
   document.getElementById("deathStats").style.display="block";
   document.getElementById("deathStats").textContent="Taille finale : "+Math.floor(player.len)+" · Temps : "+Math.floor(elapsed)+" s";
 }else{
   score+=Math.floor(s.len*4);
   showEvent("💥 "+s.name+" est tombé · +"+Math.floor(s.len*4));
   setTimeout(()=>{
     if(!snakes.includes(s))return;
     const a=rnd(0,Math.PI*2),r=rnd(2200,3600);
     const n=makeSnake(s.name,player.x+Math.cos(a)*r,player.y+Math.sin(a)*r,s.color,Math.floor(rnd(38,112)),true,s.face);
     n.x=clamp(n.x,180,world.w-180);n.y=clamp(n.y,180,world.h-180);
     snakes[snakes.indexOf(s)]=n;
   },850);
 }
}

function collisions(){
 for(const a of snakes)if(a.alive){
   // Player and bots can collide with other bodies. Heads are allowed to cross.
   for(const b of snakes)if(b.alive&&a!==b){
     const broad=260+Math.min(380,a.len*3);
     if(Math.hypot(a.x-b.x,a.y-b.y)>broad)continue;
     for(let i=7;i<b.body.length;i+=2){
       const q=b.body[i],dx=a.x-q.x,dy=a.y-q.y;
       if(dx*dx+dy*dy<=(20+Math.min(6,a.len*.01))**2){kill(a,a===player?"Une tête dans un corps, ça pardonne pas 😭":"");break}
     }
     if(!a.alive)break;
   }
 }
}

function updatePlayer(dt){
 let mag=Math.hypot(inputX,inputY);
 if(mag>.08)player.target=Math.atan2(inputY,inputX);
 const turn=boost?6.5:5.5;
 player.angle+=clamp(adiff(player.angle,player.target),-turn*dt,turn*dt);

 player.boosting=boost&&player.len>28;
 if(player.boosting){
   player.len-=.68*dt*60;
   if(Math.random()<.7){
     const q=player.body[Math.min(8,player.body.length-1)];
     addFood(q.x+rnd(-8,8),q.y+rnd(-8,8),2,rnd(3.5,5.5));
   }
 }
 moveSnake(player,dt,player.boosting?9.2:5.7);
}
function updateBot(s,dt){
 s.think-=dt;
 const dx=player.x-s.x,dy=player.y-s.y,pd=Math.hypot(dx,dy);
 if(s.think<=0){
   s.think=rnd(.18,.75);
   if(pd<1500 && Math.random()<.9)s.mode=Math.random()<.48?1:(Math.random()<.42?2:3);
   else s.mode=0;
   if(s.mode===0)s.target+=rnd(-1.2,1.2);
 }
 if(s.mode===1){
   // Intercept the player's future position.
   const lead=rnd(140,500);
   s.target=Math.atan2(player.y+Math.sin(player.angle)*lead-s.y,player.x+Math.cos(player.angle)*lead-s.x);
 }else if(s.mode===2){
   s.target=Math.atan2(dy,dx);
 }else if(s.mode===3){
   // Escape / orbit if player is too close.
   const away=Math.atan2(-dy,-dx);
   s.target=away+rnd(-.9,.9);
 }else{
   s.target+=Math.sin(elapsed*.35+s.phase)*.012;
 }
 const turn=3.8+Math.min(1.2,s.len/90);
 s.angle+=clamp(adiff(s.angle,s.target),-turn*dt,turn*dt);
 moveSnake(s,dt,4.25+Math.min(2.2,s.len/90));
}

function drawBackground(){
 ctx.fillStyle="#070910";ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(-cam.x,-cam.y);
 const grid=110;
 const sx=Math.floor(cam.x/grid)*grid-220,sy=Math.floor(cam.y/grid)*grid-220;
 ctx.strokeStyle="rgba(105,145,220,.055)";ctx.lineWidth=1;
 for(let x=sx;x<cam.x+W+220;x+=grid){ctx.beginPath();ctx.moveTo(x,cam.y-220);ctx.lineTo(x,cam.y+H+220);ctx.stroke()}
 for(let y=sy;y<cam.y+H+220;y+=grid){ctx.beginPath();ctx.moveTo(cam.x-220,y);ctx.lineTo(cam.x+W+220,y);ctx.stroke()}
 // subtle world landmarks
 ctx.fillStyle="rgba(255,255,255,.018)";
 for(let i=0;i<18;i++){let x=(i*733)%world.w,y=(i*1201)%world.h;ctx.beginPath();ctx.arc(x,y,150+(i%3)*70,0,Math.PI*2);ctx.fill()}
 ctx.strokeStyle="rgba(255,207,90,.36)";ctx.lineWidth=6;ctx.strokeRect(70,70,world.w-140,world.h-140);
 ctx.restore();
}

function drawFood(){
 ctx.save();ctx.translate(-cam.x,-cam.y);
 for(const f of foods){
   if(f.x<cam.x-20||f.x>cam.x+W+20||f.y<cam.y-20||f.y>cam.y+H+20)continue;
   const rr=f.r+Math.sin(elapsed*3.7+f.p)*.75;
   ctx.globalAlpha=.72;ctx.fillStyle="#ffe27d";ctx.shadowColor="#ffe27d";ctx.shadowBlur=8;
   ctx.beginPath();ctx.arc(f.x,f.y,rr,0,Math.PI*2);ctx.fill();
 }
 ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
}

function drawSnake(s){
 if(!s.alive)return;
 ctx.save();ctx.translate(-cam.x,-cam.y);

 // Shadow
 ctx.globalAlpha=.2;ctx.fillStyle="#000";ctx.beginPath();ctx.ellipse(s.x+2,s.y+6,18,11,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;

 // Body segments overlap enough to read as one continuous snake.
 for(let i=s.body.length-1;i>=0;i--){
   const q=s.body[i],t=i/(s.body.length-1),r=7.5+8.8*(1-t);
   ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fill();
   if(i%4===0){ctx.fillStyle="rgba(255,255,255,.14)";ctx.beginPath();ctx.arc(q.x-r*.3,q.y-r*.3,r*.24,0,Math.PI*2);ctx.fill()}
 }
 const hr=21;
 ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,hr,0,Math.PI*2);ctx.fill();

 if(s.enemy){
   const im=faceImgs[(s.face-1)%faceImgs.length];
   if(im.complete){
     ctx.save();ctx.beginPath();ctx.arc(s.x,s.y,hr-1,0,Math.PI*2);ctx.clip();
     // Fit the complete portrait into the circular head rather than zooming into the face.
     ctx.drawImage(im,s.x-hr,s.y-hr,hr*2,hr*2);
     ctx.restore();
   }
   ctx.strokeStyle="rgba(0,0,0,.55)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,hr,0,Math.PI*2);ctx.stroke();
 }else{
   // Prune's playable snake has a normal cute snake head, not the player's face.
   const fx=Math.cos(s.angle),fy=Math.sin(s.angle),px=-fy,py=fx;
   for(const side of [-1,1]){
     const ex=s.x+fx*9+px*side*6,ey=s.y+fy*9+py*side*6;
     ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ex,ey,4.2,0,Math.PI*2);ctx.fill();
     ctx.fillStyle="#111";ctx.beginPath();ctx.arc(ex+fx*1.4,ey+fy*1.4,1.8,0,Math.PI*2);ctx.fill();
   }
   // Tiny smile/tongue detail.
   ctx.strokeStyle="#16110b";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(s.x+fx*7,s.y+fy*7,5,-.65,.65);ctx.stroke();
 }
 ctx.font="900 11px -apple-system,BlinkMacSystemFont,sans-serif";ctx.textAlign="center";
 ctx.fillStyle="#fff";ctx.shadowColor="#000";ctx.shadowBlur=7;ctx.fillText(s.name,s.x,s.y-31);ctx.shadowBlur=0;
 ctx.restore();
}

function updateCamera(dt){
 // Slither-style dynamic zoom: the longer Prune gets, the more of the arena you see.
 const target=clamp(1.04-Math.max(0,player.len-40)/700,0.72,1.04);
 cam.zoom+=(target-cam.zoom)*Math.min(1,dt*4.5);
 const viewW=W/cam.zoom,viewH=H/cam.zoom;
 const tx=player.x-viewW/2,ty=player.y-viewH/2;
 cam.x+=(clamp(tx,0,world.w-viewW)-cam.x)*Math.min(1,dt*7);
 cam.y+=(clamp(ty,0,world.h-viewH)-cam.y)*Math.min(1,dt*7);
}

function render(){
 // Render world into a zoomed camera.
 ctx.save();
 ctx.translate(W/2,H/2);ctx.scale(cam.zoom,cam.zoom);ctx.translate(-W/2,-H/2);
 // Because the camera itself is stored in world units, translate from screen-space origin.
 ctx.translate((W/2)-cam.x*cam.zoom,(H/2)-cam.y*cam.zoom);
 // Easier: render with a temporary transform using world coordinates.
 ctx.restore();

 // redraw correctly with world transform
 ctx.save();
 ctx.clearRect(0,0,W,H);
 ctx.translate(W/2,H/2);ctx.scale(cam.zoom,cam.zoom);ctx.translate(-W/2,-H/2);
 ctx.translate(-cam.x,-cam.y);
 // background must be drawn under the same transform
 ctx.fillStyle="#070910";ctx.fillRect(cam.x,cam.y,W/cam.zoom,H/cam.zoom);
 const grid=110;
 const sx=Math.floor(cam.x/grid)*grid-220,sy=Math.floor(cam.y/grid)*grid-220;
 ctx.strokeStyle="rgba(105,145,220,.055)";ctx.lineWidth=1/cam.zoom;
 for(let x=sx;x<cam.x+W/cam.zoom+220;x+=grid){ctx.beginPath();ctx.moveTo(x,cam.y-220);ctx.lineTo(x,cam.y+H/cam.zoom+220);ctx.stroke()}
 for(let y=sy;y<cam.y+H/cam.zoom+220;y+=grid){ctx.beginPath();ctx.moveTo(cam.x-220,y);ctx.lineTo(cam.x+W/cam.zoom+220,y);ctx.stroke()}
 ctx.strokeStyle="rgba(255,207,90,.36)";ctx.lineWidth=6/cam.zoom;ctx.strokeRect(70,70,world.w-140,world.h-140);

 for(const f of foods){
   if(f.x<cam.x-30||f.x>cam.x+W/cam.zoom+30||f.y<cam.y-30||f.y>cam.y+H/cam.zoom+30)continue;
   const rr=f.r+Math.sin(elapsed*3.7+f.p)*.75;
   ctx.globalAlpha=.72;ctx.fillStyle="#ffe27d";ctx.shadowColor="#ffe27d";ctx.shadowBlur=8;
   ctx.beginPath();ctx.arc(f.x,f.y,rr,0,Math.PI*2);ctx.fill();
 }
 ctx.shadowBlur=0;ctx.globalAlpha=1;

 const ordered=snakes.filter(s=>s.alive).sort((a,b)=>a.len-b.len);
 for(const s of ordered){
   // body
   for(let i=s.body.length-1;i>=0;i--){
     const q=s.body[i],t=i/(s.body.length-1),r=7.5+8.8*(1-t);
     ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fill();
     if(i%4===0){ctx.fillStyle="rgba(255,255,255,.14)";ctx.beginPath();ctx.arc(q.x-r*.3,q.y-r*.3,r*.24,0,Math.PI*2);ctx.fill()}
   }
   const hr=21;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,hr,0,Math.PI*2);ctx.fill();
   if(s.enemy){
     const im=faceImgs[(s.face-1)%faceImgs.length];
     if(im.complete){ctx.save();ctx.beginPath();ctx.arc(s.x,s.y,hr-1,0,Math.PI*2);ctx.clip();ctx.drawImage(im,s.x-hr,s.y-hr,hr*2,hr*2);ctx.restore()}
     ctx.strokeStyle="rgba(0,0,0,.55)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,hr,0,Math.PI*2);ctx.stroke();
   }else{
     const fx=Math.cos(s.angle),fy=Math.sin(s.angle),px=-fy,py=fx;
     for(const side of [-1,1]){
       const ex=s.x+fx*9+px*side*6,ey=s.y+fy*9+py*side*6;
       ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ex,ey,4.2,0,Math.PI*2);ctx.fill();
       ctx.fillStyle="#111";ctx.beginPath();ctx.arc(ex+fx*1.4,ey+fy*1.4,1.8,0,Math.PI*2);ctx.fill();
     }
   }
   ctx.font="900 11px -apple-system,BlinkMacSystemFont,sans-serif";ctx.textAlign="center";ctx.fillStyle="#fff";ctx.shadowColor="#000";ctx.shadowBlur=7;ctx.fillText(s.name,s.x,s.y-31);ctx.shadowBlur=0;
 }
 ctx.restore();
}

function hud(){
 document.getElementById("score").textContent=Math.floor(score);
 document.getElementById("size").textContent=Math.floor(player.len);
 const alive=snakes.filter(s=>s.alive).sort((a,b)=>b.len-a.len),rank=alive.indexOf(player)+1;
 document.getElementById("rank").textContent="#"+rank;
 for(let i=0;i<4;i++){
   const s=alive[i],nn=document.getElementById("n"+(i+1)),ss=document.getElementById("s"+(i+1));
   if(s){nn.textContent=(i+1)+". "+s.name;ss.textContent=Math.floor(s.len)}
   else{nn.textContent=(i+1)+". —";ss.textContent="—"}
 }
 mctx.clearRect(0,0,224,156);mctx.fillStyle="#070a12";mctx.fillRect(0,0,224,156);
 for(const s of snakes)if(s.alive){
   mctx.fillStyle=s===player?"#fff":s.color;mctx.beginPath();mctx.arc(s.x/world.w*224,s.y/world.h*156,s===player?3:2,0,Math.PI*2);mctx.fill();
 }
}

let eventTimer=0;
function showEvent(text){const e=document.getElementById("event");e.textContent=text;e.classList.add("show");clearTimeout(eventTimer);eventTimer=setTimeout(()=>e.classList.remove("show"),1900)}

let inputX=0,inputY=0,joyPointer=null;
const joy=document.getElementById("joy"),stick=document.getElementById("stick");
function joyMove(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy)||1,max=r.width*.36;
 if(m>max){dx=dx/m*max;dy=dy/m*max}
 inputX=dx/max;inputY=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`;
}
joy.addEventListener("pointerdown",e=>{joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener("pointermove",e=>{if(e.pointerId===joyPointer)joyMove(e)});
function joyUp(){joyPointer=null;inputX=0;inputY=0;stick.style.transform=""}
joy.addEventListener("pointerup",joyUp);joy.addEventListener("pointercancel",joyUp);

const boostBtn=document.getElementById("boost");
boostBtn.addEventListener("pointerdown",()=>boost=true);
["pointerup","pointercancel","pointerleave"].forEach(e=>boostBtn.addEventListener(e,()=>boost=false));

// Desktop fallback: keyboard + mouse, while phone remains joystick-first.
const keys={};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.code==="Space")boost=true});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;if(e.code==="Space")boost=false});
canvas.addEventListener("pointermove",e=>{
 if(e.pointerType==="mouse"&&running){inputX=(e.clientX-W/2)/(W/2);inputY=(e.clientY-H/2)/(H/2);const m=Math.hypot(inputX,inputY)||1;if(m>1){inputX/=m;inputY/=m}}
});
function keyboard(){
 let x=0,y=0;if(keys.a||keys.arrowleft)x--;if(keys.d||keys.arrowright)x++;if(keys.w||keys.arrowup)y--;if(keys.s||keys.arrowdown)y++;
 if(x||y){const m=Math.hypot(x,y);inputX=x/m;inputY=y/m}
}

let audio=null,musicOn=true,musicTimer=null;
function startMusic(){
 if(!musicOn)return;
 try{
   if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();
   if(audio.state==="suspended")audio.resume();
   if(musicTimer)return;
   const master=audio.createGain();master.gain.value=.035;master.connect(audio.destination);
   const notes=[196,246.94,293.66,329.63,293.66,246.94,220,261.63,196,246.94,329.63,293.66];
   let i=0;
   const tick=()=>{
     if(!musicOn||!running){musicTimer=null;return}
     const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
     o.type="triangle";o.frequency.value=notes[i++%notes.length];
     g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.18,now+.035);g.gain.exponentialRampToValueAtTime(.0001,now+.52);
     o.connect(g);g.connect(master);o.start(now);o.stop(now+.56);
     musicTimer=setTimeout(tick,420);
   };
   tick();
 }catch(e){}
}
function stopMusic(){if(musicTimer){clearTimeout(musicTimer);musicTimer=null}}
document.getElementById("music").addEventListener("click",()=>{
 musicOn=!musicOn;document.getElementById("music").textContent=musicOn?"♫ ON":"♫ OFF";
 if(musicOn&&running)startMusic();else stopMusic();
});

function startGame(){
 document.getElementById("menu").style.display="none";
 document.getElementById("deathStats").style.display="none";
 document.querySelector("#menu h1").textContent="Pour Prune";
 document.querySelector("#menu .sub").innerHTML="Coucou ma Prune.<br>J’ai préparé un petit jeu pour te remonter le moral.<br><b>PS : ne me remercie pas 😘</b>";
 reset();running=true;last=performance.now();cam.zoom=1.04;startMusic();raf=requestAnimationFrame(loop);
}
document.getElementById("play").addEventListener("click",startGame);

function loop(t){
 if(!running)return;
 const dt=Math.min(.025,(t-last)/1000||.016);last=t;elapsed+=dt;
 keyboard();updatePlayer(dt);
 for(const s of snakes)if(s!==player&&s.alive)updateBot(s,dt);
 collisions();
 if(foods.length<2400)for(let i=0;i<80;i++)addFood(rnd(100,world.w-100),rnd(100,world.h-100),1+Math.floor(rnd(0,6)),rnd(3,6));
 updateCamera(dt);render();hud();
 if(Math.floor(elapsed)!==Math.floor(elapsed-dt)&&Math.floor(elapsed)%13===0){
   const messages=["😂 SAFWAN SAUVAGE REPÉRÉ","🌀 Entoure-les, ne fonce pas dedans","💨 BOOST À GOGO","😈 Le boss vient vers toi…","🐍 T'as vu la taille de celui-là ?","😂 Attention au visage de Safwan"];
   showEvent(messages[Math.floor(Math.random()*messages.length)]);
 }
 raf=requestAnimationFrame(loop);
}
})();
</script>
